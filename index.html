:root{
  --bg:#05070d;
  --surface:#0a0f1a;
  --surface2:#0e1626;
  --line:#1d2a3f;
  --line-red:#7a1f2a;
  --ink:#eef2f7;
  --muted:#9aa9bd;
  --amber:#f5b53f;
  --amber-dim:#8a6420;
  --cyan:#35e0e6;
  --cyan-dim:#176b70;
  --green:#54d68a;
  --red:#ff5d6a;
  --blue:#55ccff;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05070d;
    --surface:#0a0f1a;
    --ink:#eef2f7;
    --muted:#9aa9bd;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

h1,h2,h3{
  font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  letter-spacing:-.01em;
}

button, input, textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
}

.mono{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
}

.field{
  width:100%;
  background:#04060b;
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:9px;
  padding:10px 11px;
}

.btn{
  border-radius:9px;
  padding:9px 13px;
  font-weight:700;
  border:1px solid transparent;
}

.btn-amber{
  background:var(--amber);
  color:#181204;
}

.btn-cyan{
  background:var(--cyan);
  color:#03181a;
}

.btn-ghost{
  background:transparent;
  color:var(--ink);
  border-color:var(--line);
}

.btn-dark{
  background:#111a2b;
  color:var(--ink);
  border-color:var(--line);
}

.cell-btn{
  aspect-ratio:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  background:#080d17;
  border-radius:6px;
  font-size:12px;
}

.cell-btn:hover{
  border-color:var(--cyan);
}

.cell-btn.active{
  background:var(--cyan);
  color:#03181a;
  border-color:var(--cyan);
  font-weight:800;
}

.grid81{
  display:grid;
  grid-template-columns:repeat(9, minmax(0,1fr));
  gap:4px;
}

.grid27{
  display:grid;
  grid-template-columns:repeat(9, minmax(0,1fr));
  gap:4px;
}

@media (max-width:640px){
  .grid27{
    grid-template-columns:repeat(3, minmax(0,1fr));
  }
}

.scrollbox{
  max-height:260px;
  overflow-y:auto;
}

@media (min-width: 640px) {
  .sm\:w-\[300px\] {
    width: 300px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-6 {
    padding-top: 1.5rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_1\.1fr\] {
    grid-template-columns: 1fr 1.1fr;
  }

  .lg\:grid-cols-\[1fr_1fr\] {
    grid-template-columns: 1fr 1fr;
